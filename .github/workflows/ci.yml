name: CI

on:
  # PR のマージで main にできるコミットに check が付くのは、この実行だけ。misskey-* タグの ruleset は、tag.yml が
  # タグを打つコミットに check の成功を求めるので、PR の CI と中身が重なっても外さない。
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo doc --no-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run check
      - name: 生成物が spec と一致することを確かめる
        run: cargo codegen && git add -A src/generated && git diff --cached --exit-code -- src/generated
      - run: scripts/test-all-versions.sh
