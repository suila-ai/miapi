name: CI

on:
  # PR のマージで main にできるコミットに check が付くのは、この実行だけ。misskey-* タグの ruleset は、tag.yml が
  # タグを打つコミットに check の成功を求めるので、PR の CI と中身が重なっても外さない。
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo doc --no-deps
      - name: 生成物が spec と一致することを確かめる
        run: cargo codegen && git add -A src/generated && git diff --cached --exit-code -- src/generated
      - run: scripts/test-all-versions.sh
