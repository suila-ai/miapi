# Dependabot の version updates を使うには、更新するパッケージエコシステムと、
# パッケージのマニフェストがある場所を指定する。詳しくは次の文書を参照。
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly
 - package-ecosystem: "docker"
   directory: "/.devcontainer"
   schedule:
     interval: weekly
 - package-ecosystem: "github-actions"
   directory: "/"
   schedule:
     interval: weekly
 - package-ecosystem: "cargo"
   directory: "/"
   schedule:
     interval: weekly
   # 直接の依存が十数個あるので、互換性のある更新は 1 つの PR にまとめ、マージの回数を減らす。
   # 互換性の無い更新（0.x の minor を含む）は、コードの修正が要ることがあるので、依存ごとの PR にする。
   groups:
     cargo:
       update-types: ["minor", "patch"]
 - package-ecosystem: "npm"
   directory: "/"
   schedule:
     interval: weekly
   # typescript の major は手で上げる。7 へは compiler API の差し替え（codegen/ts-types.ts）が要るので、
   # 7.1 の API が安定してから移す。
   ignore:
     - dependency-name: "typescript"
       update-types: ["version-update:semver-major"]
