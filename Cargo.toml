[package]
name = "miapi"
version = "0.1.0"
edition = "2024"
description = "Misskey API のクライアント。自動生成でサーバのエンドポイントと型に追従する"
repository = "https://github.com/suila-ai/miapi"
license = "MIT"

[lib]
# src/ に単体テストは無いので、lib をテスト用の構成ではコンパイルしない。
# 生成コードが大きく、有効のままだと `cargo test` と `cargo clippy --all-targets` が、feature ごとに lib をもう 1 回ずつコンパイルする。
# `--all-targets` は bench = true の lib も同じ構成で検査するので、bench も切る。src/ に単体テストを足すときは test を戻すこと。
test = false
bench = false

[[example]]
name = "meta"
# クレートの直下の `Client` を使うので、`latest` が有効なときだけビルドする。
required-features = ["latest"]

[features]
default = ["latest", "streaming"]
latest = []
"v2026.5.1" = []
"v2025.10.0" = []
"v2024.10.1" = []
# ストリーミング API（WebSocket）。切ると REST だけになり、HTTP クライアントは HTTP/2 も使う。
streaming = ["dep:reqwest-websocket", "dep:tokio", "dep:futures-util"]

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink"], optional = true }
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
reqwest-websocket = { version = "0.6.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "macros"], optional = true }

[dev-dependencies]
async-tungstenite = { version = "0.35.0", features = ["tokio-runtime"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
wiremock = "0.6.5"

[workspace]
members = ["codegen"]
