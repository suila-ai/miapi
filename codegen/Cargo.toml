[package]
name = "miapi-codegen"
version = "0.1.0"
edition = "2024"
description = "Misskey の api.json から miapi のエンドポイントのバインディングを生成する"
publish = false

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.7"
