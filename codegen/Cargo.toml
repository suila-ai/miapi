[package]
name = "miapi-codegen"
version = "0.1.0"
edition = "2024"
description = "Misskey の api.json から miapi のエンドポイントのバインディングを生成する"
publish = false

[dependencies]
heck = "0.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.7"
